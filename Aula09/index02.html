<!DOCTYPE html>
<html>
    <head>
        <title>Conteúdo Aula09 - HTML</title>
    </head>
    <body>

        <h1>Definindo imagem no HTML</h1>

        <img src="img/dubai.jpg" alt="Cidade de Dubai" width="300" height="170">

        <hr>

        <h3>Definindo altura e largura de imagem com o CSS</h3>


        <img src="img/dubai.jpg" alt="Cidade de Dubai" style="width: 300px; height: 170px;">

        <hr>

        <h3>Utilizando imagens dinâmicas no HTML</h3>

        <img src="img/giphy.gif" style="width: 200px; height: 200px;">

        <hr>

        <h3>Utilizando imagem flutuante</h3>

        <p>
            <img src="img/giphy.gif" style="width: 200px ; height: 200px; float: right;">
            Somente a dor coletiva gera união.
        </p>



    </body>
</html>
