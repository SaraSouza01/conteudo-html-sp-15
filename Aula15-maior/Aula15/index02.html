<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula15 - HTML</title>
    </head>
    <body>

        <h1>Caminhos de Arquivos no HTML</h1>

        <h3>Arquivo no mesmo nível de HTML</h3>

        <img src="dubai.jpg" width="300" height="180">

        <hr>

        <h3>Arquivo em uma pasta de mesmo nível que o HTML</h3>

        <img src="img/dubai.jpg" width="300" height="180">

        <hr>

        <h3>Arquivo em um pasta na raiz da estrutura</h3>

        <img src="/Aula15-img/dubai.jpg" width="300" height="180">

        <hr>

        <h3>Arquivo em nível maior que o HTML</h3>

        <img src="../dubai.jpg" width="300" height="180">

    </body>
</html>
